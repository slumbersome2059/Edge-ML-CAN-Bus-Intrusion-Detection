data:
  _target_: tsa.fastf1_dataset.FastF1WindowDataset
  data_path: /replace/with/train_windows.npz
  batch_size: 64
  validation_fraction: 0.2

training:
  denoising: false
  directions: 1
  gradient_accumulation_steps: 1
  hidden_size_encoder: 64
  hidden_size_decoder: 64
  input_att: true
  lr: 0.0001
  lrs_step_size: 5000
  max_grad_norm: 0.1
  num_epochs: 100
  output_size: 4
  reg1: false
  reg2: false
  reg_factor1: 0.0001
  reg_factor2: 0.0001
  seq_len: 10
  temporal_att: true

general:
  do_train: true
  output_dir: output/f1
  logging_steps: 100
  save_steps: 5000
  eval_during_training: false
  external_test_path: /replace/with/test_windows.npz
  threshold_percentile: 99.0
